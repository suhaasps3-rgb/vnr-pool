name: VNR Pool Scheduled Jobs

on:
  schedule:
    - cron: '*/5 * * * *'   # Every 5 mins — reminders
    - cron: '0 * * * *'     # Every hour — archive stale rides
  workflow_dispatch:

jobs:
  ride_reminders:
    runs-on: ubuntu-latest
    steps:
      - name: Ping Reminders Endpoint
        run: |
          curl -s -o /dev/null -w "%{http_code}" \
            -H "Authorization: Bearer ${{ secrets.CRON_SECRET }}" \
            https://vnr-pool-omega.vercel.app/api/cron/reminders

  archive_stale_rides:
    runs-on: ubuntu-latest
    if: github.event.schedule == '0 * * * *' || github.event_name == 'workflow_dispatch'
    steps:
      - name: Ping Archive Endpoint
        run: |
          curl -s -o /dev/null -w "%{http_code}" \
            -H "Authorization: Bearer ${{ secrets.CRON_SECRET }}" \
            https://vnr-pool-omega.vercel.app/api/cron/archive