name: 5-Minute Ride Reminders Cron
on:
  schedule:
    - cron: '*/5 * * * *'
  workflow_dispatch: # Allows manual trigger from GitHub UI for testing

jobs:
  ping_reminders:
    runs-on: ubuntu-latest
    steps:
      - name: Hit Vercel SMS Endpoint
        run: |
          curl -H "Authorization: Bearer ${{ secrets.CRON_SECRET }}" https://vnr-pool-omega.vercel.app/api/cron/reminders
